# GitHub Actions Workflow for Continuous Integration
# The integration tests need the NDDNS_TEST_ZONE and NDDNS_TEST_ACCESS_TOKEN secrets and skip
# themselves when they are not configured (for example on pull requests from forks).

name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Go Installation Information
        run: go version
      - name: Build Binary
        run: go build -o nddns ./cmd
      - name: Run Tests
        run: go test ./...
    env:
      NDDNS_IPv6_ENABLED: false # Note: GitHub Actions does not yet support IPv6 so this has been disabled.
      NDDNS_TEST_ZONE: ${{ secrets.NDDNS_TEST_ZONE }}
      NDDNS_TEST_ACCESS_TOKEN: ${{ secrets.NDDNS_TEST_ACCESS_TOKEN }}

  # Guard the installer that users pipe into `sh`. It must parse under dash
  # (Debian / Raspberry Pi OS) and actually install a working binary.
  install:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse with dash
        run: dash -n install.sh
      - name: Parse with bash --posix
        run: bash --posix -n install.sh
      - name: Install into a temporary prefix
        # The API call is rate limited to 60 requests an hour per IP when unauthenticated, and
        # GitHub-hosted runners share their egress addresses.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          PREFIX="$RUNNER_TEMP/prefix" sh ./install.sh
          test -x "$RUNNER_TEMP/prefix/bin/nddns"
          "$RUNNER_TEMP/prefix/bin/nddns" --version
