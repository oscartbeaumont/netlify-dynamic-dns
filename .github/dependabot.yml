version: 2

multi-ecosystem-groups:
  netlify-dynamic-dns-deps:
    schedule:
      interval: "daily"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "netlify-dynamic-dns-deps"
    patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    multi-ecosystem-group: "netlify-dynamic-dns-deps"
    patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    multi-ecosystem-group: "netlify-dynamic-dns-deps"
    patterns: ["*"]
